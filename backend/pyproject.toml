[project]
name = "nail-studio-backend"
version = "0.1.0"
description = "Backend do Nail Studio Manager (E0: fundação técnica, sem funcionalidades de negócio)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
    "zxcvbn>=4.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-zxcvbn>=4.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # starlette 1.8 deprecia httpx no TestClient em favor de httpx2; seguimos
    # com httpx até a migração ser necessária (fora do escopo da E0).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated::fastapi.testclient",
]
