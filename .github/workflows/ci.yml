name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nail_studio
          POSTGRES_PASSWORD: nail_studio
          POSTGRES_DB: nail_studio
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U nail_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nail_studio:nail_studio@localhost:5432/nail_studio
      JWT_SECRET_KEY: ci-only-test-secret-with-at-least-32-bytes
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.1"
      - name: Instalar dependências
        run: uv sync --frozen
      - name: Bootstrap roles de banco
        run: uv run python scripts/bootstrap_db.py
        env:
          BOOTSTRAP_DATABASE_URL: postgresql+psycopg://nail_studio:nail_studio@localhost:5432/nail_studio
      - name: Migrations (Alembic)
        run: uv run alembic upgrade head
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://app_migration:app_migration_pw@localhost:5432/nail_studio
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Formatação (ruff format)
        run: uv run ruff format --check .
      - name: Typecheck (mypy)
        run: uv run mypy app
      - name: Testes (pytest)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Typecheck (tsc)
        run: pnpm typecheck
      - name: Testes (Vitest)
        run: pnpm test
      - name: Build (Vite)
        run: pnpm build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
